      if (code === 0 || code === 1) return { key: 'clear', emoji: '☀️' };
      if (code === 2) return { key: 'partly', emoji: '⛅' };
      if (code === 3 || (code >= 45 && code <= 48)) return { key: 'cloudy', emoji: '☁️' };
      if ((code >= 51 && code <= 67) || (code >= 80 && code <= 82)) return { key: 'rain', emoji: '🌧️' };
      if ((code >= 71 && code <= 77) || (code >= 85 && code <= 86)) return { key: 'snow', emoji: '❄️' };
      if (code >= 95) return { key: 'storm', emoji: '⛈️' };
      return { key: 'partly', emoji: '🌤️' };
    }

            wind: Math.round(data.current.wind_speed_10m),
